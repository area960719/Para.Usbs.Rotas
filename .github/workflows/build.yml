name: Crear Para.Usbs.Rotas

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias Directas
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller

    - name: Crear el Ejecutable
      run: pyinstaller --onefile --windowed --collect-all customtkinter --name "Para.Usbs.Rotas" reparar_usb_pro.py

    - name: Subir el Ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: Para_Usbs_Rotas
        path: dist/*.exe
