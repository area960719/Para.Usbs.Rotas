name: Crear Reparador de USB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar PyInstaller
      run: pip install pyinstaller

    - name: Crear el Ejecutable
      run: pyinstaller --onefile --console --name "Para.Usbs.Rotas" reparar_usb.py

    - name: Subir el Ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: Para.Usbs.Rotas
        path: dist/*.exe
